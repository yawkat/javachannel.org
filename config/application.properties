site.url=https://www.javachannel.org
# Only {=expr} and {#section} are template syntax, so curly braces in Java code samples are plain text
quarkus.qute.alt-expr-syntax=true
quarkus.web-bundler.dependencies.auto-import=all
quarkus.default-locale=en
site.time-zone=UTC
site.slugify-files=false

# WordPress permalinks: /posts/<slug>/ (the file name minus its date prefix)
site.collections.posts.layout=post
site.collections.posts.link=/posts/:name/

%dev.site.draft=true
%dev.site.future=true

---
layout: page
---
{@io.quarkiverse.roq.frontmatter.runtime.model.NormalPage page}

<ul class="archive-list">
{#for post in site.collections.get('posts')}
{#if post.data.categories?? && post.data.categories.asStrings.contains(page.data.category)}
  <li><span class="archive-date">{=post.date.format('yyyy-MM-dd')}</span> <a href="{=post.url}">{=post.title}</a></li>
{/if}
{/for}
</ul>
